<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Home | Library Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(5,15,30,0.80),
                    rgba(5,15,30,0.85)
                ),
                url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;
        }

        .navbar {
            min-height: 72px;

            background: rgba(5,12,25,0.82);

            border-bottom: 1px solid rgba(255,255,255,0.15);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px 40px;
        }

        .brand {
            color: white;

            text-decoration: none;

            font-size: 24px;

            font-weight: bold;
        }

        .brand span {
            color: #f5a400;
        }

        .nav-link {
            color: white;

            text-decoration: none;

            margin-left: 25px;

            font-size: 15px;
        }

        .nav-link:hover {
            color: #f5a400;
        }

        .logout {
            color: #ff7777;
        }

        .main {
            min-height: calc(100vh - 72px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;
        }

        .container {
            width: 900px;

            max-width: 100%;

            text-align: center;
        }

        .header {
            background: rgba(255,255,255,0.96);

            border-radius: 20px;

            padding: 35px;

            margin-bottom: 25px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        .icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        h1 {
            color: #172033;

            font-size: 32px;

            margin-bottom: 10px;
        }

        h1 span {
            color: #d99000;
        }

        p {
            color: #777;

            font-size: 15px;
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.96);

            padding: 35px 20px;

            border-radius: 16px;

            text-decoration: none;

            color: #172033;

            box-shadow:
                0 12px 30px rgba(0,0,0,0.25);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);

            border: 1px solid #f5a400;
        }

        .card-icon {
            font-size: 40px;

            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .navbar {
                flex-direction: column;

                gap: 15px;

                padding: 18px;
            }

            .nav-link {
                margin: 5px 8px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<nav class="navbar">

    <a href="{% url 'index' %}" class="brand">
        Library <span>Management</span>
    </a>

    <div>

        <a href="{% url 'view_books' %}" class="nav-link">
            Books
        </a>

        <a href="{% url 'book_slot' %}" class="nav-link">
            Book Slot
        </a>

        <a href="{% url 'logout' %}" class="nav-link logout">
            Logout
        </a>

    </div>

</nav>


<main class="main">

    <div class="container">

        <div class="header">

            <div class="icon">
                📚
            </div>

            <h1>
                Welcome to the
                <span>Library</span>
            </h1>

            <p>
                {{ msg }}
            </p>

        </div>


        <div class="cards">

            <a href="{% url 'view_books' %}"
               class="card">

                <div class="card-icon">
                    📖
                </div>

                <h3>
                    View Books
                </h3>

                <p>
                    Browse available books in the library.
                </p>

            </a>


            <a href="{% url 'book_slot' %}"
               class="card">

                <div class="card-icon">
                    📅
                </div>

                <h3>
                    Book a Slot
                </h3>

                <p>
                    Reserve a book and select a time slot.
                </p>

            </a>

        </div>

    </div>

</main>

</body>

</html>
