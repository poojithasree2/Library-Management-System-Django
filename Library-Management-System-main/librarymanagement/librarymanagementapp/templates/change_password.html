{% extends "base.html" %}

{% block title %}
Change Password - LibraryHub
{% endblock %}

{% block content %}

<div class="page-container">

    <div class="page-header">

        <h1>
            <i class="bi bi-key"></i>
            Change Password
        </h1>

        <p>
            Update your student account password.
        </p>

    </div>


    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="form-card">

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }} custom-alert">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">

                            Current Password

                        </label>

                        <input
                            type="password"
                            name="current_password"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">

                            New Password

                        </label>

                        <input
                            type="password"
                            name="new_password"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">

                            Confirm New Password

                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >

                        <i class="bi bi-check-circle"></i>

                        Change Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
