{% extends "base.html" %}

{% block title %}
Edit Book - Library Management System
{% endblock %}

{% block content %}

<style>

    .form-container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h1 {
        color: #1e3a8a;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 11px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        box-sizing: border-box;
    }

    textarea {
        min-height: 120px;
    }

    button {
        background: #1e3a8a;
        color: white;
        padding: 12px 22px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
    }

    .message {
        background: #dcfce7;
        color: #166534;
        padding: 12px;
        border-radius: 7px;
        margin-bottom: 20px;
    }

</style>


<div class="form-container">

    <h1>✏️ Edit Book</h1>

    {% if msg %}

        <div class="message">
            {{ msg }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>Book Name</label>

            <input type="text"
                   name="book_name"
                   value="{{ book.1 }}"
                   required>

        </div>


        <div class="form-group">

            <label>Author</label>

            <input type="text"
                   name="author"
                   value="{{ book.2 }}"
                   required>

        </div>


        <div class="form-group">

            <label>Total Available Books</label>

            <input type="number"
                   name="total_books"
                   value="{{ book.3 }}"
                   min="0"
                   required>

        </div>


        <div class="form-group">

            <label>Category</label>

            <input type="text"
                   name="category"
                   value="{{ book.4 }}"
                   required>

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea name="description">{{ book.5 }}</textarea>

        </div>


        <div class="form-group">

            <label>Book Cover URL</label>

            <input type="text"
                   name="book_cover"
                   value="{{ book.6 }}">

        </div>


        <button type="submit">
            💾 Update Book
        </button>

    </form>

</div>

{% endblock %}
