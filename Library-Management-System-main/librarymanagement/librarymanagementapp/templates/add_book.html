<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Book | Library Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    rgba(5,15,30,0.80),
                    rgba(5,15,30,0.84)
                ),
                url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {

            min-height: 72px;

            background:
                rgba(5,12,25,0.88);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                15px 40px;

            backdrop-filter:
                blur(10px);
        }


        .brand {

            color: white;

            text-decoration: none;

            font-size: 24px;

            font-weight: bold;
        }


        .brand span {

            color:
                #f5a400;
        }


        .nav-links {

            display: flex;

            gap: 25px;
        }


        .nav-links a {

            color: white;

            text-decoration: none;

            font-weight: 600;

            transition:
                0.3s;
        }


        .nav-links a:hover {

            color:
                #f5a400;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            min-height:
                calc(100vh - 72px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                40px 20px;
        }


        /* =====================================================
           FORM BOX
        ===================================================== */

        .box {

            width:
                560px;

            max-width:
                100%;

            background:
                rgba(255,255,255,0.97);

            padding:
                40px;

            border-radius:
                20px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.45);
        }


        /* =====================================================
           ICON
        ===================================================== */

        .icon {

            width:
                70px;

            height:
                70px;

            margin:
                auto auto 18px;

            background:
                #f5a400;

            color:
                white;

            border-radius:
                50%;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            font-size:
                32px;

            box-shadow:
                0 8px 20px
                rgba(245,164,0,0.30);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {

            text-align:
                center;

            color:
                #172033;

            margin-bottom:
                8px;

            font-size:
                30px;
        }


        .subtitle {

            text-align:
                center;

            color:
                #777;

            margin-bottom:
                28px;
        }


        /* =====================================================
           INPUT GROUP
        ===================================================== */

        .input-group {

            margin-bottom:
                20px;
        }


        label {

            display:
                block;

            margin-bottom:
                7px;

            font-weight:
                bold;

            font-size:
                14px;

            color:
                #172033;
        }


        input {

            width:
                100%;

            height:
                52px;

            padding:
                12px;

            border:
                1px solid #d5d5d5;

            border-radius:
                10px;

            font-size:
                15px;

            outline:
                none;

            transition:
                0.3s;
        }


        input:focus {

            border-color:
                #f5a400;

            box-shadow:
                0 0 0 3px
                rgba(245,164,0,0.12);
        }


        /* =====================================================
           COVER URL HELP TEXT
        ===================================================== */

        .help-text {

            display:
                block;

            margin-top:
                7px;

            font-size:
                12px;

            color:
                #777;

            line-height:
                1.5;
        }


        /* =====================================================
           COVER PREVIEW
        ===================================================== */

        .cover-preview {

            display:
                none;

            margin-top:
                15px;

            text-align:
                center;
        }


        .cover-preview img {

            width:
                120px;

            height:
                160px;

            object-fit:
                cover;

            border-radius:
                10px;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.20);
        }


        .preview-text {

            display:
                block;

            margin-top:
                7px;

            font-size:
                12px;

            color:
                #64748b;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .btn {

            width:
                100%;

            height:
                52px;

            border:
                none;

            border-radius:
                10px;

            background:
                #f5a400;

            color:
                white;

            font-size:
                17px;

            font-weight:
                bold;

            cursor:
                pointer;

            transition:
                0.3s;
        }


        .btn:hover {

            background:
                #d98f00;

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(217,143,0,0.30);
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            margin-top:
                18px;

            padding:
                11px;

            text-align:
                center;

            background:
                #ecfdf3;

            color:
                #198754;

            border-radius:
                8px;

            font-weight:
                bold;
        }


        /* =====================================================
           BACK LINK
        ===================================================== */

        .back {

            display:
                block;

            text-align:
                center;

            margin-top:
                20px;

            color:
                #d99000;

            text-decoration:
                none;

            font-weight:
                bold;
        }


        .back:hover {

            text-decoration:
                underline;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:700px) {

            .navbar {

                flex-direction:
                    column;

                gap:
                    15px;

                padding:
                    18px 20px;
            }


            .nav-links {

                flex-wrap:
                    wrap;

                justify-content:
                    center;

                gap:
                    15px;
            }


            .main {

                padding:
                    25px 15px;
            }


            .box {

                padding:
                    28px 22px;

                border-radius:
                    16px;
            }


            h1 {

                font-size:
                    26px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">


    <a
        href="{% url 'index' %}"
        class="brand"
    >

        📚 Library
        <span>Management</span>

    </a>


    <div class="nav-links">


        <a href="{% url 'index' %}">
            Home
        </a>


        <a href="{% url 'admin_login' %}">
            Admin
        </a>


        <a href="{% url 'view_books' %}">
            Books
        </a>


    </div>


</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <div class="box">


        <!-- ICON -->

        <div class="icon">
            📖
        </div>


        <!-- TITLE -->

        <h1>
            Add Book
        </h1>


        <p class="subtitle">

            Add a new book to the library

        </p>



        <!-- =================================================
             FORM
        ================================================= -->

        <form
            method="POST"
            id="bookForm"
        >

            {% csrf_token %}


            <!-- BOOK NAME -->

            <div class="input-group">

                <label>
                    Book Name
                </label>

                <input
                    type="text"
                    name="book_name"
                    placeholder="Enter book name"
                    required
                >

            </div>



            <!-- AUTHOR -->

            <div class="input-group">

                <label>
                    Author
                </label>

                <input
                    type="text"
                    name="author"
                    placeholder="Enter author name"
                    required
                >

            </div>



            <!-- TOTAL BOOKS -->

            <div class="input-group">

                <label>
                    Total Books
                </label>

                <input
                    type="number"
                    name="total_books"
                    min="1"
                    placeholder="Enter number of books"
                    required
                >

            </div>



            <!-- =================================================
                 BOOK COVER URL
            ================================================= -->

            <div class="input-group">

                <label>
                    📕 Book Cover Image URL
                </label>

                <input
                    type="url"
                    name="book_cover"
                    id="book_cover"
                    placeholder="https://example.com/book-cover.jpg"
                >

                <span class="help-text">

                    Paste a direct URL of the book cover image.
                    This image will appear on the Available Books page.

                </span>


                <!-- COVER PREVIEW -->

                <div
                    class="cover-preview"
                    id="coverPreview"
                >

                    <img
                        id="previewImage"
                        src=""
                        alt="Book Cover Preview"
                    >

                    <span class="preview-text">
                        Book Cover Preview
                    </span>

                </div>

            </div>



            <!-- SUBMIT -->

            <input
                type="submit"
                value="📚 Add Book"
                class="btn"
            >


        </form>



        <!-- =================================================
             MESSAGE
        ================================================= -->

        {% if msg %}

            <div class="message">

                {{ msg }}

            </div>

        {% endif %}



        <!-- BACK -->

        <a
            href="{% url 'admin_login' %}"
            class="back"
        >

            ← Back to Admin

        </a>


    </div>


</main>



<!-- =====================================================
     COVER PREVIEW JAVASCRIPT
===================================================== -->

<script>

const coverInput =
    document.getElementById("book_cover");

const coverPreview =
    document.getElementById("coverPreview");

const previewImage =
    document.getElementById("previewImage");


coverInput.addEventListener(
    "input",
    function () {

        const url =
            this.value.trim();


        if (!url) {

            coverPreview.style.display =
                "none";

            previewImage.src = "";

            return;
        }


        previewImage.onload =
            function () {

                coverPreview.style.display =
                    "block";

            };


        previewImage.onerror =
            function () {

                coverPreview.style.display =
                    "none";

            };


        previewImage.src =
            url;

    }
);

</script>


</body>

</html>
