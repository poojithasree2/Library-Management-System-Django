<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remove Student | Library Management</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            rgba(5,15,30,0.82),
            rgba(5,15,30,0.86)
        ),
        url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=2000&q=90");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.navbar {
    min-height: 72px;
    background: rgba(5,12,25,0.85);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 40px;
}

.brand {
    color: white;
    text-decoration: none;
    font-size: 24px;
    font-weight: bold;
}

.brand span {
    color: #f5a400;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: white;
    text-decoration: none;
}

.nav-links a:hover {
    color: #f5a400;
}

.main {
    min-height: calc(100vh - 72px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.box {
    width: 450px;
    max-width: 100%;
    background: rgba(255,255,255,0.97);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
}

.icon {
    width: 70px;
    height: 70px;
    margin: auto auto 20px;
    background: #dc3545;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

h1 {
    text-align: center;
    color: #172033;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    height: 52px;
    padding: 12px;
    border: 1px solid #d5d5d5;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 15px;
}

.btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 10px;
    background: #dc3545;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.btn:hover {
    background: #bb2d3b;
}

.message {
    margin-top: 20px;
    padding: 11px;
    text-align: center;
    background: #ecfdf3;
    color: #198754;
    border-radius: 8px;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #d99000;
    text-decoration: none;
    font-weight: bold;
}

@media(max-width:700px) {

    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
    }
}

</style>

</head>

<body>

<nav class="navbar">

<a href="{% url 'index' %}" class="brand">
    📚 Library <span>Management</span>
</a>

<div class="nav-links">

<a href="{% url 'index' %}">Home</a>
<a href="{% url 'students' %}">Students</a>
<a href="{% url 'admin_login' %}">Admin</a>

</div>

</nav>

<main class="main">

<div class="box">

<div class="icon">
    👤
</div>

<h1>Remove Student</h1>

<p class="subtitle">
    Enter the student ID to remove the account
</p>

<form method="POST">

{% csrf_token %}

<label>Student ID</label>

<input type="number"
       name="student_id"
       placeholder="Enter student ID"
       required>

<input type="submit"
       value="Remove Student"
       class="btn">

</form>

{% if msg %}

<div class="message">
    {{ msg }}
</div>

{% endif %}

<a href="{% url 'students' %}" class="back">
    ← View Students
</a>

</div>

</main>

</body>

</html>
